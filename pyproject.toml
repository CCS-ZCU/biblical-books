[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblical-books"
version = "0.1.0"
description = "Reproducible K10plus harvesting for a Biblical Studies bibliography"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "pandas>=2.2,<4", "pyarrow>=18,<24"]

[project.scripts]
biblical-books = "biblical_books.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
