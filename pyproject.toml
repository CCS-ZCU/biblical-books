[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biblical-studies-books-mining"
version = "0.1.0"
description = "Reproducible K10plus harvesting for a Biblical Studies bibliography"
requires-python = ">=3.11"
dependencies = ["requests>=2.32,<3", "pandas>=2.2,<4", "pyarrow>=18,<24"]
readme = "README.md"
license = {file = "LICENSE.md"}
authors = [
    {name = "Vojtěch Kaše"},
]
keywords = ["Biblical Studies", "K10plus", "MARC", "bibliography", "digital humanities"]

[project.urls]
Homepage = "https://github.com/kasev/biblical-studies-books-mining"
Repository = "https://github.com/kasev/biblical-studies-books-mining"
Documentation = "https://github.com/kasev/biblical-studies-books-mining/blob/main/EXTRACTION.md"

[project.scripts]
biblical-books = "biblical_books.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
